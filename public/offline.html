<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b72">
  <title>Нет подключения</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;color:#1a2d47;background:radial-gradient(circle at 15% 10%,rgba(232,184,75,.2),transparent 22rem),linear-gradient(145deg,#f6f9fd,#e8f0f9);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.offline-card{width:min(100%,460px);padding:clamp(25px,6vw,42px);text-align:center;background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:24px;box-shadow:0 25px 70px rgba(20,60,105,.16)}img{width:min(150px,42vw);height:auto;margin-bottom:20px}.offline-mark{display:grid;width:58px;height:58px;margin:0 auto 18px;place-items:center;color:#fff;background:linear-gradient(145deg,#1b5094,#0f2d5a);border-radius:18px;font-size:26px;font-weight:800}h1{margin:0;font-size:clamp(24px,7vw,34px);letter-spacing:-.04em}p{margin:12px 0 24px;color:#62738a;font-size:14px;line-height:1.6}button{min-height:46px;padding:10px 20px;color:#fff;background:#174b87;border:0;border-radius:12px;font:700 13px inherit;cursor:pointer}@media(max-width:420px){.offline-card{border-radius:19px}}
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="/images/university-logo.svg" alt="Горный университет">
    <div class="offline-mark" aria-hidden="true">!</div>
    <h1>Нет подключения</h1>
    <p>Для защиты учебных и персональных данных содержимое кабинета доступно только при подключении к интернету.</p>
    <button type="button" onclick="location.reload()">Повторить подключение</button>
  </main>
</body>
</html>
